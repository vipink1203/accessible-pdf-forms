[project]
name = "accessible-pdf-forms"
version = "0.1.0"
description = "Turn a flat PDF form into a guided, screen-reader-friendly interview and write the answers back onto the original."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=1.60",
    "playwright>=1.50",
    "pymupdf>=1.25",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
