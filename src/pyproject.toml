[project]
name = "fill-aloud"
version = "0.1.0"
description = "Fill in any PDF form by talking: a guided voice or screen-reader interview that writes the answers onto the original form."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=1.60",
    "playwright>=1.50",
    "pymupdf>=1.25",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
