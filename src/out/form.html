<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form W-9, page 1</title><style>
:root { --bg: #f7f7f5; --surface: #fff; --text: #1b1b1f; --muted: #55565e; --line: #d9d9de; --accent: #1f4fd1; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121316; --surface: #1b1c20; --text: #ececf1; --muted: #a8a9b3; --line: #33343b; --accent: #8fb0ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
form > div, fieldset { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
                       padding: .9rem 1rem; margin: 0 0 .75rem; }
form > div > label { display: block; margin-bottom: .4rem; }
legend { float: left; width: 100%; font-weight: 600; padding: 0; margin-bottom: .5rem; }
legend + * { clear: both; }
fieldset div { display: flex; gap: .5rem; align-items: flex-start; padding: .2rem 0; }
form > div:has(input[type=checkbox]) { display: flex; gap: .5rem; align-items: flex-start; }
input[type=text] { width: 100%; font: inherit; padding: .55rem .7rem; color: var(--text); background: var(--surface);
                   border: 1px solid var(--muted); border-radius: 8px; }
input[type=checkbox] { width: 1.1rem; height: 1.1rem; margin: .2rem 0 0; accent-color: var(--accent); flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

interest, check this box if you have any foreign partners, owners, or beneficiaries. See instructions</label></div><div><label for="f12">4 Exempt payee code (if any)</label><input type="text" id="f12" name="f12"></div><div><label for="f13">4 Exemption from Foreign Account Tax Compliance Act (FATCA) reporting code (if any)</label><input type="text" id="f13" name="f13"></div><div><label for="f14">5 Address (number, street, and apt. or suite no.). See instructions.</label><input type="text" id="f14" name="f14"></div><div><label for="f15">Requester&#x27;s name and address (optional)</label><input type="text" id="f15" name="f15"></div><div><label for="f16">6 City, state, and ZIP code</label><input type="text" id="f16" name="f16"></div><div><label for="f17">7 List account number(s) here (optional)</label><input type="text" id="f17" name="f17"></div><div><label for="f18">Social security number</label><input type="text" id="f18" name="f18"></div><div><label for="f19">Social security number</label><input type="text" id="f19" name="f19"></div><div><label for="f20">Social security number</label><input type="text" id="f20" name="f20"></div><div><label for="f21">Employer identification number</label><input type="text" id="f21" name="f21"></div><div><label for="f22">Employer identification number</label><input type="text" id="f22" name="f22"></div><div><label for="f23">Signature of U.S. person</label><input type="text" id="f23" name="f23"></div><div><label for="f24">Date</label><input type="text" id="f24" name="f24"></div></form></main></body></html>
